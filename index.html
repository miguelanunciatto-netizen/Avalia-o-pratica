<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo do Futebol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tema-claro">

    <div>
        <h1>Paixão pelo Futebol</h1>
        <p>O futebol é o esporte mais popular do mundo, unindo bilhões de torcedores em torno da mesma emoção.</p>
        
        <button id="btn-tema">Alternar Tema Escuro</button>
    </div>

    <div>
        <h2>Grandes Competições</h2>
        <ul>
            <li>Copa do Mundo FIFA</li>
            <li>Liga dos Campeões da UEFA</li>
            <li>Copa Libertadores da América</li>
        </ul>
        <a href="https://www.fifa.com" target="_blank">Visite o site oficial da FIFA</a>
    </div>

    <div>
        <h2>Galeria e Interação</h2>
        <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=500&q=80" alt="Bola de futebol no gramado">
        <br>
        <button id="btn-curtir">Curtir ⚽ (<span id="contador">0</span>)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
